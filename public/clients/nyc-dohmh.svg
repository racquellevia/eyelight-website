  <text x="32" y="24" text-anchor="middle" fill="#fafafa" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="0.02em">N</text>
  <text x="32" y="42" text-anchor="middle" fill="#fafafa" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="0.02em">Y</text>
  <text x="32" y="60" text-anchor="middle" fill="#fafafa" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="0.02em">C</text>
  <text x="80" y="30" fill="#0a0a0a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="0.01em">NYC Department of Health</text>
